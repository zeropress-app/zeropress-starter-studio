{{#if_eq partial.variant "archive"}}
  <li class="archive-entry" data-post-index="{{loop.index}}">
    <a href="{{post.url}}">{{post.title}}</a>
    <time datetime="{{post.published_at_iso}}" title="{{post.published_at_iso}}" data-zp-local-date-time>{{post.published_at}}</time>
  </li>
{{#else}}
  <article class="post-list-item post-list-item--{{partial.variant}}" data-post-index="{{loop.index}}">
    <div class="post-meta">
      <time datetime="{{post.published_at_iso}}" title="{{post.published_at_iso}}" data-zp-local-date-time>{{post.published_at}}</time>
      <span class="meta-sep" aria-hidden="true"></span>
      <span>{{post.reading_time}}</span>
    </div>
    <h2><a href="{{post.url}}">{{post.title}}</a></h2>
    {{#if partial.show_excerpt}}{{#if post.summary}}<p class="post-excerpt">{{post.summary}}</p>{{/if}}{{/if}}
    <a class="read-link" href="{{post.url}}">Continue reading <svg class="icon icon--inline" width="18" height="18" aria-hidden="true" focusable="false"><use href="#icon-arrow-right"/></svg></a>
  </article>
{{/if}}
