<div class="shell page-shell">
  <div class="detail-grid">
    <article class="article-shell article-shell--page">
      <header class="article-header" {{#if page.excerpt}}data-pagefind-meta="excerpt:{{page.excerpt}}"{{/if}}>
        <p class="eyebrow">Page</p>
        <h1 data-pagefind-meta="title">{{page.title}}</h1>
      </header>
      {{#if page.featured_image}}<img class="article-featured-image" src="{{page.featured_image}}" alt="">{{/if}}
      <div class="article-content prose-blog" {{#if site.search.enabled}}{{#if_neq page.discoverability "delist"}}data-pagefind-body{{/if}}{{/if}}>{{page.html}}</div>
      {{#if comments.enabled}}
        {{partial:comments-island}}
      {{/if}}
    </article>

    {{#if widgets.sidebar.items}}
      {{partial:detail-sidebar}}
    {{/if}}
  </div>
</div>
